<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remote Quiz</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/specific.css">
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>
    <main style="min-height:100vh; display:flex; align-items:center; justify-content:center; padding:16px; background:linear-gradient(180deg,#10131a,#1b2230); color:#fff;">
        <section style="width:100%; max-width:560px; background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.12); border-radius:20px; padding:20px; box-shadow:0 20px 60px rgba(0,0,0,0.35);">
            <div style="display:flex; justify-content:space-between; gap:12px; align-items:center; margin-bottom:16px;">
                <div>
                    <h1 style="margin:0; font-size:1.4rem;">Pregunta remota</h1>
                    <p id="remoteRoomLabel" style="margin:4px 0 0; opacity:0.75; font-size:0.95rem;">Sala: ...</p>
                </div>
                <div id="connectionState" style="font-size:0.9rem; padding:8px 10px; border-radius:999px; background:rgba(255,255,255,0.1);">Conectando...</div>
            </div>

            

            <!-- Chat para móviles -->
            <div id="chatPanel" style="margin-top:18px; display:flex; flex-direction:column; gap:10px;">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <strong style="font-size:1rem;">Chat de la sala</strong>
                    <small id="chatUsersCount" style="opacity:0.8;">1 conectado</small>
                </div>

                <div id="chatMessages" style="height:180px; overflow:auto; padding:10px; background:rgba(0,0,0,0.08); border-radius:8px; border:1px solid rgba(255,255,255,0.03);"></div>

                <div style="display:flex; gap:8px;">
                    <input id="chatInput" type="text" placeholder="Escribe un mensaje..." style="flex:1; padding:10px 12px; border-radius:10px; border:1px solid rgba(255,255,255,0.06); background:transparent; color:#fff;" />
                    <button id="sendMsgBtn" type="button" style="padding:10px 14px; border-radius:10px; background:#2f8f4a; border:none; color:#fff; font-weight:700;">Enviar</button>
                </div>
            </div>

            <div id="questionView" style="display:none;">
                <div id="questionText" style="font-size:1.2rem; line-height:1.4; margin-bottom:18px; font-weight:700;"></div>
                <div id="answerGrid" style="display:grid; gap:12px;"></div>
            </div>

            <div id="resultView" style="display:none; margin-top:18px; padding:14px; border-radius:14px; background:rgba(0,0,0,0.18);">
                <strong id="resultTitle">Resultado</strong>
                <div id="resultText" style="margin-top:6px; opacity:0.9;"></div>
            </div>
        </section>
    </main>

    <script src="/js/signaling-init.js"></script>
    <script src="/js/chat.js"></script>
    <script src="/js/remote-init.js"></script>
</body>
</html>
