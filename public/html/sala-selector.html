<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScapeRoom GDIE - Seleccionar Sala</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/specific.css">
    <link rel="icon" type="image/x-icon" sizes="32x32" href="../assets/img/icono.png">
</head>
<body>
    <div id="header-placeholder"></div>

    <main class="selector-container">
        <div class="selector-card">
            <p class="selector-subtitle">Elige el tipo de sala en la que deseas participar</p>

            <div class="room-options">
                <button class="room-option public" id="publicBtn">
                    <span class="room-label">Sala Pública</span>
                </button>

                <button class="room-option private" id="privateBtn">
                  
                    <span class="room-label">Sala Privada</span>
                   
                </button>
            </div>
        </div>
    </main>

    <!-- Modal Sala Privada -->
    <div class="modal-overlay" id="privateModal">
        <div class="modal-card">
            <h2 class="modal-title">Sala Privada</h2>

            <div class="modal-actions">
                <button class="action-btn active" data-action="create" id="createBtn">
                     Crear Sala
                </button>
                <button class="action-btn" data-action="join" id="joinBtn">
                     Unirse
                </button>
            </div>

            <!-- Crear Sala -->
            <div class="form-group active" id="createForm">
                <label for="roomNameInput">Nombre de la Sala:</label>
                <input type="text" id="roomNameInput" placeholder="Ej: sala-amigos" maxlength="20">
                <div class="error-msg" id="createError"></div>
            </div>

            <!-- Unirse a Sala -->
            <div class="form-group" id="joinForm">
                <label for="roomCodeInput">Código de Sala:</label>
                <input type="text" id="roomCodeInput" placeholder="Ej: sala-amigos" maxlength="20">
                <div class="error-msg" id="joinError"></div>
            </div>

            <div class="modal-footer">
                <button class="btn-confirm" id="confirmBtn">Continuar</button>
                <button class="btn-cancel" id="cancelBtn">Cancelar</button>
            </div>
        </div>
    </div>

    <div id="footer-placeholder"></div>
    <script src="/js/main.js"></script>
    <script src="/js/sala-selector.js"></script>
</body>
</html>
